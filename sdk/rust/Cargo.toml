[package]
name = "decisionmaker"
version = "0.1.0"
edition = "2021"
description = "Thin typed client for the Decision-Maker service (/v1/decisionmaker)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["async"]
# transport: reqwest (async, tokio) or blocking via reqwest::blocking.
async = ["dep:reqwest", "dep:tokio"]
blocking = ["dep:reqwest", "reqwest/blocking", "dep:tokio"]

[target.'cfg(unix)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"